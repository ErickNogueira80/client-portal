<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
            --code-bg: #090d16;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Barra Lateral com os Filtros em Cascata */
        aside { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-header { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        
        .filter-group { margin-bottom: 15px; }
        .filter-group label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; display: block; }
        .filter-group select { width: 100%; background-color: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 9px; border-radius: 6px; font-size: 0.9rem; outline: none; transition: 0.2s; cursor: pointer; }
        .filter-group select:focus { border-color: var(--accent); }
        .filter-group select:disabled { opacity: 0.5; cursor: not-allowed; }

        .sidebar-nav-link { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .sidebar-nav-link a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: block; padding: 6px 8px; border-radius: 4px; transition: 0.2s; }
        .sidebar-nav-link a:hover { background-color: var(--border); color: var(--text-main); }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        
        .content-section { background-color: var(--sidebar-bg); border: 1px solid var(--border); padding: 25px; border-radius: 8px; display: none; }
        .content-section.active { display: block; }
        .content-section h3 { margin-bottom: 15px; color: var(--accent); font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .info-block { margin-bottom: 15px; }
        p, ul { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; }
        ul { padding-left: 20px; }
        
        pre { background-color: var(--code-bg); border: 1px solid var(--border); padding: 15px; border-radius: 6px; overflow-x: auto; margin-top: 10px; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.85rem; color: #e2e8f0; }
        a.link-item { color: var(--accent); text-decoration: none; }
        a.link-item:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">🚀 Portal de Clientes</div>

        <div class="filter-group">
            <label for="select-cliente">1. Cliente</label>
            <select id="select-cliente" onchange="atualizarTimes()">
                <option value="">Selecione o Cliente...</option>
                <option value="ambev">Ambev</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="select-time">2. Time</label>
            <select id="select-time" onchange="atualizarProjetos()" disabled>
                <option value="">Selecione o Time...</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="select-projeto">3. Projeto</label>
            <select id="select-projeto" onchange="exibirConteudo()" disabled>
                <option value="">Selecione o Projeto...</option>
            </select>
        </div>

        <div class="sidebar-nav-link">
            <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px;">Atalhos</span>
            <a href="clientes/ambev.html">📄 Ver Página Completa (Ambev)</a>
        </div>
    </aside>

    <main>
        <div id="welcome-view">
            <h1>Painel de Navegação</h1>
            <p style="color: var(--text-muted); margin-top: 10px;">Utilize os seletores na barra lateral esquerda para filtrar o cliente, o time e o projeto desejado.</p>
        </div>

        <div id="resultado-conteudo" class="content-section">
            <h3 id="proj-titulo">📁 Projeto</h3>
            
            <div class="info-block" style="margin-top: 15px;">
                <strong style="color: var(--accent);">🔑 Acessos:</strong>
                <div id="proj-acessos"></div>
            </div>

            <div class="info-block" style="margin-top: 15px;">
                <strong style="color: var(--accent);">🌐 Servidores SAZ / Ambientes:</strong>
                <div id="proj-servidores"></div>
            </div>

            <div class="info-block" style="margin-top: 15px;">
                <strong style="color: var(--accent);">💻 Queries Úteis:</strong>
                <div id="proj-queries"></div>
            </div>

            <div class="info-block" style="margin-top: 15px;">
                <strong style="color: var(--accent);">🔗 Links Úteis:</strong>
                <div id="proj-links"></div>
            </div>
        </div>
    </main>

    <script>
        // Banco de dados central do portal
        const dadosPortal = {
            ambev: {
                nome: "Ambev",
                times: {
                    gov: {
                        nome: "Time: GOV",
                        projetos: {
                            "genie-cost": {
                                nome: "Genie Cost",
                                acessos: `
                                    <p><strong>Usuário de Serviço:</strong> <code>srv_saleslab@ab-inbev.com</code></p>
                                    <p><strong>Senha:</strong> <code>GU$2"G4L9067kD7Q:Pm,vrz;%k{*qr@u</code></p>
                                `,
                                servidores: `
                                    <ul>
                                        <li><strong>SAZ - CSC:</strong> <code>brewdatsazfabric08p</code></li>
                                        <li><strong>SAZ - B2B:</strong> <code>brewdatsazfabric06p</code> (GEOS)</li>
                                        <li><strong>SAZ - Sales_Lab_Prod:</strong> <code>brewdatsazfabric10p</code> (PROD)</li>
                                    </ul>
                                `,
                                queries: `
                                    <p style="color: var(--text-main); margin-bottom: 5px;"><strong>Consulta para avaliar capacity PBI:</strong></p>
                                    <pre><code>PowerBIDatasetsWorkspace\n| where PowerBIWorkspaceId == "DB989EE3-0185-41CD-80A3-F1F56B065054"\n| where OperationName in ("VertiPaqSEQueryBegin", "VertiPaqSEQueryEnd")\n| summarize TotalExecucoes = count(), TotalCpuMs = sum(CpuTimeMs) by ArtifactName</code></pre>
                                `,
                                links: `
                                    <ul>
                                        <li><a href="https://dev.azure.com/AMBEV-SA/AMBEV-ANALYTICS/_git/PBIAudit" target="_blank" class="link-item">Repositório PBIAudit (Azure DevOps)</a></li>
                                    </ul>
                                `
                            },
                            "log-aas": {
                                nome: "Log AAS",
                                acessos: `
                                    <p><strong>Usuário de Serviço:</strong> <code>srv_saleslab@ab-inbev.com</code></p>
                                    <p><strong>Ambiente Log AAS:</strong> Configurado via SAZ - Sales_Lab_Critico</p>
                                `,
                                servidores: `
                                    <ul>
                                        <li><strong>SAZ - Sales_Lab_Critico:</strong> <code>brewdatsazfabric09p</code></li>
                                        <li><strong>SAZ - Sales_Lab_SSBI:</strong> <code>brewdatsazfabric11p</code> (DEV)</li>
                                    </ul>
                                `,
                                queries: `
                                    <p style="color: var(--text-main); margin-bottom: 5px;"><strong>Query por usuário (Log AAS):</strong></p>
                                    <pre><code>let escopo = PowerBIDatasetsWorkspace\n| where TimeGenerated between (ago(7d) .. now())\n| where PowerBIWorkspaceId =~ "db989ee3-0185-41cd-80a3-f1f56b065054";\nescopo\n| take 50</code></pre>
                                `,
                                links: `
                                    <ul>
                                        <li><a href="https://biaaudit-1820723078635205.5.azure.databricksapps.com/api/performance/" target="_blank" class="link-item">Databricks API Performance</a></li>
                                    </ul>
                                `
                            }
                        }
                    }
                }
            }
        };

        function atualizarTimes() {
            const clienteKey = document.getElementById("select-cliente").value;
            const selectTime = document.getElementById("select-time");
            const selectProjeto = document.getElementById("select-projeto");
            const welcomeView = document.getElementById("welcome-view");
            const resultadoView = document.getElementById("resultado-conteudo");

            // Resetar
            selectTime.innerHTML = '<option value="">Selecione o Time...</option>';
            selectProjeto.innerHTML = '<option value="">Selecione o Projeto...</option>';
            selectProjeto.disabled = true;
            resultadoView.classList.remove("active");
            welcomeView.style.display = "block";

            if (!clienteKey) {
                selectTime.disabled = true;
                return;
            }

            const times = dadosPortal[clienteKey].times;
            for (let tKey in times) {
                let opt = document.createElement("option");
                opt.value = tKey;
                opt.textContent = times[tKey].nome;
                selectTime.appendChild(opt);
            }
            selectTime.disabled = false;
        }

        function atualizarProjetos() {
            const clienteKey = document.getElementById("select-cliente").value;
            const timeKey = document.getElementById("select-time").value;
            const selectProjeto = document.getElementById("select-projeto");
            const welcomeView = document.getElementById("welcome-view");
            const resultadoView = document.getElementById("resultado-conteudo");

            selectProjeto.innerHTML = '<option value="">Selecione o Projeto...</option>';
            resultadoView.classList.remove("active");
            welcomeView.style.display = "block";

            if (!timeKey) {
                selectProjeto.disabled = true;
                return;
            }

            const projetos = dadosPortal[clienteKey].times[timeKey].projetos;
            for (let pKey in projetos) {
                let opt = document.createElement("option");
                opt.value = pKey;
                opt.textContent = projetos[pKey].nome;
                selectProjeto.appendChild(opt);
            }
            selectProjeto.disabled = false;
        }

        function exibirConteudo() {
            const clienteKey = document.getElementById("select-cliente").value;
            const timeKey = document.getElementById("select-time").value;
            const projetoKey = document.getElementById("select-projeto").value;
            const welcomeView = document.getElementById("welcome-view");
            const resultadoView = document.getElementById("resultado-conteudo");

            if (!projetoKey) {
                resultadoView.classList.remove("active");
                welcomeView.style.display = "block";
                return;
            }

            const projData = dadosPortal[clienteKey].times[timeKey].projetos[projetoKey];

            document.getElementById("proj-titulo").textContent = "📁 Projeto: " + projData.nome;
            document.getElementById("proj-acessos").innerHTML = projData.acessos;
            document.getElementById("proj-servidores").innerHTML = projData.servidores;
            document.getElementById("proj-queries").innerHTML = projData.queries;
            document.getElementById("proj-links").innerHTML = projData.links;

            welcomeView.style.display = "none";
            resultadoView.classList.add("active");
        }
    </script>

</body>
</html>
