<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--accent); }
        .sidebar-menu { padding: 20px; list-style: none; overflow-y: auto; flex: 1; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { color: var(--text-muted); text-decoration: none; display: block; padding: 8px 12px; border-radius: 6px; transition: 0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--border); color: var(--text-main); }
        .menu-category { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin: 15px 0 5px 12px; letter-spacing: 0.05em; }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 20px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background-color: var(--sidebar-bg); border: 1px solid var(--border); padding: 20px; border-radius: 8px; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .card-header { text-decoration: none; color: inherit; margin-bottom: 15px; display: block; }
        .card-header h3 { margin-bottom: 5px; color: var(--text-main); }
        .card-header p { font-size: 0.9rem; margin-bottom: 0; }
        
        .card-projects { font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 12px; }
        .card-projects span { margin-right: 4px; }
        .project-link { color: var(--accent); text-decoration: none; }
        .project-link:hover { text-decoration: underline; }
        
        .badge { display: inline-block; background-color: #334155; color: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-top: 8px; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">🚀 Portal de Clientes</div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active">Visão Geral</a></li>
            
            <div class="menu-category">Clientes</div>
            <li><a href="clientes/ambev.html">Ambev</a></li>
        </ul>
    </aside>

    <main>
        <h1>Painel Geral</h1>
        <p>Selecione um cliente na barra lateral ou clique diretamente nos projetos abaixo.</p>

        <div class="card-grid">
            <div class="card">
                <a href="clientes/ambev.html" class="card-header">
                    <h3>Ambev</h3>
                    <p>Visão geral, acessos e queries gerais</p>
                    <span class="badge">Time: GOV</span>
                </a>
                
                <div class="card-projects">
                    <strong>Projetos:</strong> 
                    <a href="clientes/ambev.html" class="project-link">Genie Cost</a> <span>|</span> 
                    <a href="clientes/ambev.html" class="project-link">Log AAS</a>
                </div>
            </div>
            </div>
    </main>

</body>
</html>
