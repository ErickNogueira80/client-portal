<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--accent); }
        .sidebar-menu { padding: 20px; list-style: none; overflow-y: auto; flex: 1; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { color: var(--text-muted); text-decoration: none; display: block; padding: 8px 12px; border-radius: 6px; transition: 0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: var(--border); color: var(--text-main); }
        .menu-category { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin: 15px 0 5px 12px; letter-spacing: 0.05em; }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 20px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background-color: var(--sidebar-bg); border: 1px solid var(--border); padding: 20px; border-radius: 8px; text-decoration: none; color: inherit; transition: 0.2s; }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .card h3 { margin-bottom: 8px; color: var(--text-main); }
        .card p { font-size: 0.9rem; margin-bottom: 0; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">🚀 Portal de Clientes</div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active">Visão Geral</a></li>
            
            <div class="menu-category">Clientes</div>
            <li><a href="clientes/cliente-a.html">Cliente A</a></li>
            </ul>
    </aside>

    <main>
        <h1>Painel Geral</h1>
        <p>Selecione um cliente na barra lateral ou nos cards abaixo para ver as tasks, queries e acessos.</p>

        <div class="card-grid">
            <a href="clientes/cliente-a.html" class="card">
                <h3>Cliente A</h3>
                <p>Status: Ativo • Ver tasks e acessos</p>
            </a>
            </div>
    </main>

</body>
</html>
